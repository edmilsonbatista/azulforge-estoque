trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: estoque-deploy
  - name: pythonVersion
    value: "3.12"

stages:
  - stage: Build
    displayName: Testar e criar imagem
    jobs:
      - job: TestAndBuild
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: Selecionar Python

          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements-dev.txt
              python -m pytest -q
            displayName: Instalar dependências e executar testes

          - task: AzureCLI@2
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name "$ACR_NAME"
                login_server=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
                image="$login_server/azulforge-estoque:$IMAGE_TAG"
                docker build --tag "$image" "$BUILD_SOURCESDIRECTORY"
                docker push "$image"
            env:
              ACR_NAME: $(containerRegistryName)
              RESOURCE_GROUP: $(resourceGroupName)
              IMAGE_TAG: $(Build.BuildId)
              BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
            displayName: Criar e publicar imagem no ACR

  - stage: DeployDev
    displayName: Publicar em dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Dev
        environment: estoque-dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      login_server=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
                      az containerapp update \
                        --name "$CONTAINER_APP" \
                        --resource-group "$RESOURCE_GROUP" \
                        --image "$login_server/azulforge-estoque:$IMAGE_TAG" \
                        --output none
                  env:
                    ACR_NAME: $(containerRegistryName)
                    RESOURCE_GROUP: $(resourceGroupName)
                    CONTAINER_APP: $(containerAppDev)
                    IMAGE_TAG: $(Build.BuildId)
                  displayName: Atualizar Container App dev

  - stage: DeployHml
    displayName: Publicar em hml
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Hml
        environment: estoque-hml
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      login_server=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
                      az containerapp update \
                        --name "$CONTAINER_APP" \
                        --resource-group "$RESOURCE_GROUP" \
                        --image "$login_server/azulforge-estoque:$IMAGE_TAG" \
                        --output none
                  env:
                    ACR_NAME: $(containerRegistryName)
                    RESOURCE_GROUP: $(resourceGroupName)
                    CONTAINER_APP: $(containerAppHml)
                    IMAGE_TAG: $(Build.BuildId)
                  displayName: Atualizar Container App hml

                - task: PowerShell@2
                  inputs:
                    targetType: inline
                    script: |
                      $healthUrl = "$(urlHml)/health"
                      $healthy = $false
                      for ($attempt = 1; $attempt -le 12; $attempt++) {
                        try {
                          $response = Invoke-RestMethod -Uri $healthUrl -TimeoutSec 15
                          if ($response.status -eq "ok") {
                            $healthy = $true
                            break
                          }
                        } catch {
                          Start-Sleep -Seconds 10
                        }
                      }
                      if (-not $healthy) {
                        throw "A verificação de saúde de hml falhou: $healthUrl"
                      }
                  displayName: Verificar saúde de hml

  - stage: ValidateHml
    displayName: Validar hml manualmente
    dependsOn: DeployHml
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ManualHmlValidation
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              instructions: "Valide a interface e os fluxos de cadastro em hml ($(urlHml)). Aprove para solicitar a publicação em prod ou rejeite para interromper o pipeline."
              onTimeout: reject

  - stage: DeployProd
    displayName: Publicar em prod (demonstração)
    dependsOn: ValidateHml
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Prod
        environment: estoque-prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      login_server=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)
                      az containerapp update \
                        --name "$CONTAINER_APP" \
                        --resource-group "$RESOURCE_GROUP" \
                        --image "$login_server/azulforge-estoque:$IMAGE_TAG" \
                        --output none
                  env:
                    ACR_NAME: $(containerRegistryName)
                    RESOURCE_GROUP: $(resourceGroupName)
                    CONTAINER_APP: $(containerAppProd)
                    IMAGE_TAG: $(Build.BuildId)
                  displayName: Atualizar Container App prod
